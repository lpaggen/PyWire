[package]
name = "pywire-python-ast"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Owned Rust representations of the Python 3.14 AST, decoded from PyWire Protocol Buffers"
license = "MIT"
readme = "README.md"
repository = "https://github.com/lpaggen/PyWire"
keywords = ["python", "ast", "protobuf", "parser"]
categories = ["data-structures", "encoding", "parser-implementations"]
include = ["src/**", "proto/**", "build.rs", "README.md", "LICENSE"]

[lib]
name = "pywire_python_ast"
path = "src/lib.rs"

[[bin]]
name = "pywire-python-ast-decode"
path = "src/main.rs"

[dependencies]
prost = "0.13"

[build-dependencies]
prost-build = "0.13"
